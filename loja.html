<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loja</title>


<style>

body{

margin:0;

height:100vh;

background:
linear-gradient(
rgba(0,0,0,.8),
rgba(0,0,0,.95)
),
url("https://images.unsplash.com/photo-1518709268805-4e9042af9f23")
center/cover;


font-family:Arial;

color:white;

display:flex;

justify-content:center;

align-items:center;

}



.container{

text-align:center;

background:#111;

padding:30px;

border-radius:15px;

border:2px solid red;

width:380px;

}



h1{

color:red;

font-size:40px;

}



.moedas{

font-size:25px;

color:gold;

margin-bottom:25px;

}



.item{

background:#222;

margin:15px;

padding:15px;

border-radius:10px;

border:1px solid #555;

}



button{

padding:12px;

width:90%;

font-size:18px;

background:red;

color:white;

border:none;

border-radius:10px;

cursor:pointer;

}



button:hover{

background:#900;

}



.voltar{

margin-top:20px;

background:#333;

}



</style>


</head>


<body>


<div class="container">


<h1>🛒 LOJA</h1>


<div class="moedas">

🪙 Moedas:
<span id="moedas">500</span>

</div>



<div class="item">

🔫 Pistola Melhorada

<br>

+10 Dano

<br><br>

<button onclick="comprar('arma',200)">
Comprar - 200 moedas
</button>

</div>




<div class="item">

❤️ Kit Médico

<br>

+30 Vida

<br><br>

<button onclick="comprar('vida',150)">
Comprar - 150 moedas
</button>

</div>




<div class="item">

⚡ Treino de Velocidade

<br>

+1 Velocidade

<br><br>

<button onclick="comprar('velocidade',300)">
Comprar - 300 moedas
</button>

</div>




<button class="voltar" onclick="voltar()">

🔙 VOLTAR

</button>



</div>



<script>


let moedas =
Number(localStorage.getItem("moedas")) || 500;



document.getElementById("moedas").innerHTML =
moedas;




function comprar(item,preco){



if(moedas >= preco){


moedas -= preco;


localStorage.setItem(
"moedas",
moedas
);



localStorage.setItem(
item,
"comprado"
);



document.getElementById("moedas").innerHTML =
moedas;



alert(
"Compra realizada!"
);



}else{


alert(
"Moedas insuficientes!"
);



}


}



function voltar(){

location.href="index.html";

}



</script>



</body>

</html>
