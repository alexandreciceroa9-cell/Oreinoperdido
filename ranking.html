<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ranking</title>


<style>

body{

margin:0;

height:100vh;

background:
linear-gradient(
rgba(0,0,0,.8),
rgba(0,0,0,.95)
),
url("https://images.unsplash.com/photo-1518709268805-4e9042af9f23")
center/cover;


font-family:Arial;

color:white;

display:flex;

justify-content:center;

align-items:center;

}



.container{

width:450px;

background:#111;

padding:25px;

border:2px solid red;

border-radius:15px;

text-align:center;

}



h1{

font-size:45px;

color:gold;

}



.jogador{

background:#222;

padding:15px;

margin:15px;

border-radius:10px;

border:1px solid #555;

font-size:20px;

}



button{

width:90%;

padding:15px;

margin-top:15px;

font-size:20px;

background:red;

color:white;

border:none;

border-radius:10px;

cursor:pointer;

}



button:hover{

background:#900;

}



input{

padding:10px;

width:80%;

font-size:18px;

border-radius:8px;

}


</style>


</head>


<body>


<div class="container">


<h1>🏆 RANKING</h1>



<div id="lista">


<div class="jogador">

🥇 Rafael

<br>

💀 500 zumbis

<br>

🪙 2000 moedas

</div>


<div class="jogador">

🥈 Luna

<br>

💀 350 zumbis

<br>

🪙 1500 moedas

</div>


<div class="jogador">

🥉 Max

<br>

💀 200 zumbis

<br>

🪙 900 moedas

</div>


</div>



<h2>Adicionar seu recorde</h2>


<input id="nome" placeholder="Seu nome">


<br><br>


<button onclick="salvar()">

⭐ SALVAR PONTUAÇÃO

</button>



<button onclick="voltar()">

🔙 VOLTAR

</button>



</div>




<script>


function salvar(){


let nome =
document.getElementById("nome").value;


let pontos =
localStorage.getItem("pontuacao") || 0;



if(nome==""){

alert("Digite seu nome!");

return;

}



let lista =
document.getElementById("lista");



lista.innerHTML += `

<div class="jogador">

🏅 ${nome}

<br>

💀 ${pontos} zumbis

<br>

🪙 Sobrevivente

</div>

`;



alert("Recorde salvo!");



}




function voltar(){

location.href="index.html";

}


</script>



</body>

</html>
