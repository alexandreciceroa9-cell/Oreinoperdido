<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>O Reino Perdido</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Verdana,sans-serif;
}

body{

overflow:hidden;
height:100vh;
width:100vw;

background:url("fundo.jpg") center center;
background-size:cover;
background-repeat:no-repeat;

display:flex;
justify-content:center;
align-items:center;

position:relative;

animation:zoom 25s infinite alternate;

}

@keyframes zoom{

0%{
background-size:100%;
}

100%{
background-size:110%;
}

}

#particulas{

position:absolute;

top:0;
left:0;

width:100%;
height:100%;

overflow:hidden;

pointer-events:none;

}

.particula{

position:absolute;

width:4px;
height:4px;

background:#ffd84d;

border-radius:50%;

box-shadow:
0 0 10px gold,
0 0 20px gold,
0 0 40px gold;

animation:subir linear infinite;

opacity:.8;

}

@keyframes subir{

0%{

transform:translateY(100vh);

opacity:0;

}

20%{

opacity:1;

}

100%{

transform:translateY(-120vh);

opacity:0;

}

}

.menu{

position:absolute;

top:50%;

left:50%;

transform:translate(-50%,-50%);

display:flex;

flex-direction:column;

align-items:center;

gap:18px;

}

.titulo{

font-size:85px;

font-weight:bold;

color:#ffdd55;

text-shadow:

0 0 10px #fff,

0 0 20px gold,

0 0 40px orange,

0 0 80px orange;

animation:brilho 2s infinite alternate;

margin-bottom:35px;

}

@keyframes brilho{

0%{

filter:brightness(100%);

}

100%{

filter:brightness(180%);

}

}
.botao{

width:460px;

height:72px;

border:3px solid #b8860b;

border-radius:18px;

background:linear-gradient(#3a2a12,#151515);

color:#ffd76b;

font-size:30px;

font-weight:bold;

cursor:pointer;

transition:.25s;

box-shadow:

0 0 10px rgba(255,215,0,.5),

inset 0 0 15px rgba(255,255,255,.08);

letter-spacing:1px;

}

.botao:hover{

transform:scale(1.08);

background:linear-gradient(#6f4c17,#2d2d2d);

box-shadow:

0 0 20px gold,

0 0 40px orange,

0 0 60px gold;

}

.botao:active{

transform:scale(.96);

}

.icones{

position:absolute;

top:20px;

right:20px;

display:flex;

gap:15px;

}

.icone{

width:65px;

height:65px;

border-radius:50%;

background:rgba(0,0,0,.6);

border:2px solid gold;

display:flex;

justify-content:center;

align-items:center;

font-size:30px;

color:gold;

cursor:pointer;

transition:.3s;

box-shadow:0 0 15px rgba(255,215,0,.5);

}

.icone:hover{

transform:rotate(15deg) scale(1.12);

box-shadow:

0 0 20px gold,

0 0 35px orange;

}

.rodape{

position:absolute;

bottom:25px;

right:25px;

}

.recompensa{

width:260px;

height:75px;

border-radius:15px;

border:2px solid gold;

background:rgba(20,20,20,.85);

color:#ffd84d;

font-size:24px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

.recompensa:hover{

transform:scale(1.08);

box-shadow:0 0 25px gold;

}

@media(max-width:900px){

.titulo{

font-size:58px;

}

.botao{

width:330px;

height:62px;

font-size:22px;

}

.recompensa{

width:190px;

font-size:18px;

}

.icone{

width:55px;

height:55px;

font-size:24px;

}
