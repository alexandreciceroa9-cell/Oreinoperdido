<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Base do Sobrevivente</title>


<style>

body{

margin:0;

height:100vh;

background:
linear-gradient(
rgba(0,0,0,.8),
rgba(0,0,0,.95)
),
url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee")
center/cover;


font-family:Arial;

color:white;

display:flex;

justify-content:center;

align-items:center;

}


.container{

width:450px;

background:#111;

padding:25px;

border:2px solid red;

border-radius:15px;

text-align:center;

}


h1{

font-size:45px;

color:red;

}



.status{

color:gold;

font-size:22px;

margin:20px;

}



.construcao{

background:#222;

padding:15px;

margin:15px;

border-radius:10px;

border:1px solid #555;

}



button{

width:90%;

padding:15px;

margin-top:15px;

font-size:18px;

background:red;

color:white;

border:none;

border-radius:10px;

cursor:pointer;

}



button:hover{

background:#900;

}



</style>

</head>


<body>


<div class="container">


<h1>🏠 BASE</h1>



<div class="status">

🧱 Nível da Base:
<span id="nivel">1</span>

<br><br>

🛡️ Defesa:
<span id="defesa">50</span>

<br><br>

🪵 Madeira:
<span id="madeira">100</span>

</div>




<div class="construcao">

🧱 Fortificar Muralha

<br><br>

Custo:

50 Madeira

<br><br>

<button onclick="melhorarBase()">

MELHORAR

</button>

</div>



<div class="construcao">

🔦 Torre de Vigia

<br><br>

Detecta zumbis mais cedo

<br><br>

<button onclick="construirTorre()">

CONSTRUIR

</button>

</div>



<button onclick="voltar()">

🔙 VOLTAR

</button>



</div>



<script>


let nivel =
Number(localStorage.getItem("nivelBase")) || 1;


let defesa =
Number(localStorage.getItem("defesa")) || 50;


let madeira =
Number(localStorage.getItem("madeira")) || 100;



function atualizar(){


document.getElementById("nivel").innerHTML =
nivel;


document.getElementById("defesa").innerHTML =
defesa;


document.getElementById("madeira").innerHTML =
madeira;


}



function melhorarBase(){


if(madeira >= 50){


madeira -= 50;

nivel++;

defesa += 25;



salvar();



alert(
"Base fortalecida!"
);



}else{


alert(
"Madeira insuficiente!"
);


}



}



function construirTorre(){


if(madeira >= 80){


madeira -= 80;

defesa += 15;


salvar();


alert(
"Torre construída!"
);



}else{


alert(
"Você precisa de mais madeira!"
);


}



}




function salvar(){


localStorage.setItem(
"nivelBase",
nivel
);


localStorage.setItem(
"defesa",
defesa
);


localStorage.setItem(
"madeira",
madeira
);


atualizar();


}



atualizar();



function voltar(){

location.href="index.html";

}



</script>


</body>

</html>
