<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mapa do Mundo</title>


<style>

body{

margin:0;

height:100vh;

background:
linear-gradient(
rgba(0,0,0,.7),
rgba(0,0,0,.9)
),
url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee")
center/cover;

font-family:Arial;

color:white;

display:flex;

justify-content:center;

align-items:center;

}



.container{

text-align:center;

}



h1{

font-size:45px;

color:red;

text-shadow:0 0 20px black;

}



.mapa{

position:relative;

width:600px;

height:400px;

background:#243524;

border:3px solid red;

border-radius:20px;

overflow:hidden;

}



.area{

position:absolute;

padding:15px;

background:#222;

border:2px solid white;

border-radius:10px;

cursor:pointer;

transition:.3s;

}



.area:hover{

background:red;

transform:scale(1.1);

}



.cidade{

top:80px;

left:100px;

}



.floresta{

top:250px;

left:80px;

}



.hospital{

top:120px;

right:100px;

}



.fabrica{

bottom:50px;

right:120px;

}



button{

margin-top:25px;

padding:15px 50px;

font-size:20px;

background:red;

color:white;

border:none;

border-radius:10px;

cursor:pointer;

}



</style>

</head>


<body>



<div class="container">


<h1>🗺️ MAPA DO MUNDO</h1>



<div class="mapa">


<div class="area cidade" onclick="entrar('Cidade Abandonada')">

🏚️ Cidade

</div>



<div class="area floresta" onclick="entrar('Floresta Sombria')">

🌲 Floresta

</div>



<div class="area hospital" onclick="entrar('Hospital')">

🏥 Hospital

</div>



<div class="area fabrica" onclick="entrar('Fábrica')">

🏭 Fábrica

</div>



</div>



<button onclick="voltar()">

🔙 VOLTAR

</button>



</div>



<script>


function entrar(local){


localStorage.setItem(
"localAtual",
local
);


alert(
"Você entrou em: "+local
);


// depois podemos ligar ao jogo

}



function voltar(){

location.href="index.html";

}



</script>



</body>

</html>
