<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Configurações</title>


<style>

body{

margin:0;

height:100vh;

background:
linear-gradient(
rgba(0,0,0,.8),
rgba(0,0,0,.95)
),
url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee")
center/cover;


font-family:Arial;

color:white;

display:flex;

justify-content:center;

align-items:center;

}


.container{

background:#111;

border:2px solid red;

border-radius:15px;

padding:30px;

width:350px;

text-align:center;

box-shadow:0 0 30px black;

}


h1{

color:red;

font-size:35px;

}



.opcao{

margin:25px 0;

font-size:20px;

}



input, select{

width:90%;

padding:10px;

font-size:18px;

border-radius:8px;

}



button{


width:90%;

padding:15px;

margin-top:15px;

font-size:20px;

background:#222;

color:white;

border:2px solid red;

border-radius:10px;

cursor:pointer;


}



button:hover{

background:red;

}



</style>


</head>



<body>


<div class="container">


<h1>⚙️ CONFIGURAÇÕES</h1>



<div class="opcao">

🔊 Volume

<br>

<input 
type="range" 
id="volume"
min="0"
max="100"
value="50">

</div>



<div class="opcao">

☠️ Dificuldade

<br>

<select id="dificuldade">

<option>Fácil</option>

<option selected>Normal</option>

<option>Difícil</option>

<option>Apocalipse</option>

</select>

</div>



<div class="opcao">

🎮 Controles

<br>

<p>
W A S D = Movimento
<br>
Clique = Atirar
</p>

</div>



<button onclick="salvar()">
💾 SALVAR
</button>



<button onclick="voltar()">
🔙 VOLTAR
</button>



</div>



<script>


function salvar(){


let volume=
document.getElementById("volume").value;


let dificuldade=
document.getElementById("dificuldade").value;



localStorage.setItem(
"volume",
volume
);


localStorage.setItem(
"dificuldade",
dificuldade
);



alert(
"Configurações salvas!"
);


}




function voltar(){

location.href="index.html";

}



</script>



</body>

</html>
