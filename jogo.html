};

teclas[e.key]=true;

function criarZumbi(){


let lado=Math.floor(Math.random()*4);

let x,y;


if(lado==0){

x=0;
y=Math.random()*canvas.height;

}

if(lado==1){

x=canvas.width;
y=Math.random()*canvas.height;

}

if(lado==2){

x=Math.random()*canvas.width;
y=0;

}

if(lado==3){

x=Math.random()*canvas.width;
y=canvas.height;

}


zombies.push({

x:x,
y:y,

size:25,

vel:1.3

});


}


setInterval(criarZumbi,1200);
